[phases.setup]
# Add gd for dompdf PDF generation — other PHP extensions included by default
nixPkgs = ["php83Extensions.gd"]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction",
    "npm ci"
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "bash scripts/deploy.sh"
